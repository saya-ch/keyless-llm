name: discover

# 发现新的免鉴权大模型服务 —— 这一层用 agent，不用脚本
# （v2 触发索引）
#
# 为什么要 agent：
#   「搜索」不是确定性任务。需要读文档、猜 API 路径、辨别「真的免鉴权」
#   还是「藏了个注册墙」、判断是否只是临时促销端点、评估合规性。
#   这些都是语义判断，脚本做不了，硬写规则只会得到一堆假阳性。
#
# 分工：
#   agent 负责 —— 搜索 + 语义判断 + 产出候选（candidates.json）
#   脚本负责 —— 实测候选是否真的免鉴权（validate-source.mjs）
#
# 本 workflow 只在有 agent 运行环境时启用（例如设置了 OPENAI_API_KEY）。
# 未配置 key 时自动跳过，不影响仓库的日常 CI。

on:
  schedule:
    # 每天 04:23 UTC（北京时间 12:23），和 probe 错开，避免同一分钟抢资源
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      query:
        description: "自定义搜索词（留空则用默认关键词组）"
        required: false
        type: string

permissions:
  contents: write
  # 让 GITHUB_TOKEN 能调用 GitHub Models 作为 agent 的 LLM 后端。
  # 为什么不用我们的网关：GitHub Actions 是共享出口 IP，
  # 免费来源普遍按 IP 限流，网关在 CI 上很可能一到就全部 429。
  # GitHub Models 走官方通道，零配置、无 secret，是 CI 场景的可靠后端。
  models: read

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 本仓库的维护全在 GitHub Actions 上跑，没有本地定时任务。
    #
    # agent 的 LLM 后端优先级：
    #   ① 本项目自己的网关（自举，零成本）—— CI 共享出口 IP 可能被限流，不一定通
    #   ② GitHub Models（GITHUB_TOKEN，零配置）—— 走官方通道，最可靠
    #   ③ 纯规则提取（完全不用 LLM）
    # 降级链在脚本内部，任何一档失败都不会让 job 失败。
    env:
      KEYLESS_GATEWAY: http://127.0.0.1:8788
      KEYLESS_KEY: sk-keyless-local
      KEYLESS_MODEL: auto
      AGENT_BASE_URL: ${{ secrets.AGENT_BASE_URL }}
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      AGENT_MODEL: ${{ secrets.AGENT_MODEL }}
      SEARCH_QUERY: ${{ inputs.query }}
      KEYLESS_PROBE_ENV: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── 启动本项目网关作为 agent 的 LLM 后端（自举）──────────────
      # 关掉启动探测（PROBE_ON_START=0）：CI 上探测会白烧请求配额，
      # 且我们要的就是「先别浪费额度，直接试能不能用」。
      - name: 启动 keyless-llm 网关
        env:
          KEYLESS_PROBE_ON_START: "0"
          KEYLESS_PROBE: "0"
        run: |
          node server.mjs > gateway.log 2>&1 &
          echo $! > gateway.pid
          for i in $(seq 1 30); do
            if curl -sf -m 3 http://127.0.0.1:8788/health > /dev/null 2>&1; then
              echo "网关已就绪（${i}s）"
              exit 0
            fi
            sleep 1
          done
          echo "::warning::网关启动超时，将降级到 GitHub Models"
          cat gateway.log || true

      # ── 自检：回答「CI 上我们的网关到底能不能用」──────────────────
      # 这是本 workflow 的诊断步骤，结果写进 job summary，
      # 跑几次就能看出 CI 共享 IP 是否真被免费来源限流。
      - name: 网关可用性自检
        id: gwcheck
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/gw.json -w "%{http_code}" -m 60 \
            http://127.0.0.1:8788/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer sk-keyless-local" \
            -d '{"model":"auto","max_tokens":20,"stream":false,"messages":[{"role":"user","content":"say ok"}]}')
          echo "code=$code"
          if [ "$code" = "200" ]; then
            used=$(node -e 'const j=require("/tmp/gw.json");console.log(j.model||"?")' 2>/dev/null || echo "?")
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "### 网关自检：可用（实际模型 \`$used\`）" >> "$GITHUB_STEP_SUMMARY"
            echo "CI 共享出口 IP 未被限流，agent 走自举网关。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            echo "### 网关自检：不可用（HTTP $code）" >> "$GITHUB_STEP_SUMMARY"
            echo "CI 共享出口 IP 大概率被免费来源限流，agent 降级到 GitHub Models。" >> "$GITHUB_STEP_SUMMARY"
            head -c 300 /tmp/gw.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi

      - name: Agent 搜索并产出候选来源
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/discover-with-agent.mjs

      - name: 实测候选是否真的免鉴权
        run: |
          if [ ! -f candidates.json ]; then
            echo "agent 未产出候选文件，跳过"
            exit 0
          fi
          node scripts/validate-source.mjs --file candidates.json --json | tee /tmp/candidates-report.json || true

      - name: 汇总结果
        run: |
          echo "### 本轮结果" >> "$GITHUB_STEP_SUMMARY"
          if [ -f candidates.json ]; then
            node -e '
              const c = require("./candidates.json");
              console.log(`实际使用的 LLM 后端：\`${c.llmBackend || "无"}\``);
              console.log(`搜索后端：\`${c.searchBackend || "无"}\``);
              console.log(`候选数：${(c.candidates || []).length}`);
            ' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/candidates-report.json ]; then
            node -e '
              const r = require("/tmp/candidates-report.json");
              const k = r.filter(x => x.verdict === "keyless");
              const l = r.filter(x => x.verdict === "limited");
              console.log(`免鉴权 ${k.length} 个，受限 ${l.length} 个`);
              for (const x of k) console.log(`  ✓ ${x.label} ${x.base}`);
              for (const x of l) console.log(`  △ ${x.label} ${x.base}（当前限流）`);
            '
          fi

      - name: 停止网关
        if: always()
        run: |
          if [ -f gateway.pid ]; then
            kill "$(cat gateway.pid)" 2>/dev/null || true
            echo "网关已停止"
          fi
          if [ -f gateway.log ]; then
            echo "--- 网关日志（最后 25 行）---"
            tail -25 gateway.log || true
          fi

      - name: 提交候选清单（供人工评审）
        if: always() && hashFiles('candidates.json') != ''
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add candidates.json
          if git diff --staged --quiet; then
            echo "候选清单无变化"
          else
            git commit -m "chore(discover): agent 搜索到的新候选来源"
            git push
          fi
