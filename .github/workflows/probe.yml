name: probe

# 每日探测：确认已登记的免鉴权来源今天还能不能用
# （v2 触发索引）
# 纯确定性探测，不需要任何 API key，也不需要 LLM。
# 结果写入 snapshots/status.json 并自动提交，便于在 README 里展示实时可用性。

on:
  schedule:
    # GitHub Actions 用 UTC：每天 03:17（北京时间 11:17）
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - "providers.json"
      - "scripts/probe-sources.mjs"
      - ".github/workflows/probe.yml"

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 探测全部来源
        env:
          # 标注探测环境：CI 的共享出口 IP 容易被按 IP 限流，
          # 单次失败不能判定来源死亡，脚本据此提高死亡判定阈值
          KEYLESS_PROBE_ENV: ci
        run: node scripts/probe-sources.mjs --out snapshots/status.json

      - name: 校验快照格式
        run: |
          node -e '
            const s = require("./snapshots/status.json");
            if (!s.generatedAt) throw new Error("缺少 generatedAt");
            if (!Array.isArray(s.providers) || !s.providers.length) throw new Error("快照为空");
            console.log("环境:", s.env || "(未标注)");
            console.log("来源:", s.providers.map(p => `${p.id}=${p.ok}/${p.freeModels}`).join(" "));
            console.log("合计:", JSON.stringify(s.summary));
            for (const p of s.providers) {
              if (p.suggestDead) console.warn(`⚠ ${p.id} 连续 ${p.failStreak} 轮无可用模型，建议人工复核`);
            }
          '

      - name: 提交快照
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots/status.json
          if git diff --staged --quiet; then
            echo "快照无变化"
          else
            git commit -m "chore(snapshot): 更新来源可用性快照"
            # discover 可能同时在跑。快照是幂等的（新一轮覆盖旧一轮），
            # 遇并发提交竞争时软重置到远端最新、把当前快照重放上去，不做 rebase 合并。
            ok=0
            for i in 1 2 3 4; do
              git fetch origin "$GITHUB_REF_NAME" || { sleep 10; continue; }
              if git reset --mixed "origin/$GITHUB_REF_NAME"; then
                git add snapshots/status.json
                git commit -m "chore(snapshot): 更新来源可用性快照"
                if git push; then ok=1; break; fi
              fi
              echo "push 第${i}次被拒（并发提交竞争），10s 后重试"
              sleep 10
            done
            [ "$ok" = "1" ] || { echo "::error::push 重试 4 次仍失败"; exit 1; }
          fi
