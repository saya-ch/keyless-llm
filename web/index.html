<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>keyless-llm</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

:root{
  --bg:#0A0A0B; --card:#111113; --card-h:#16161A;
  --line:rgba(255,255,255,.07); --line-h:rgba(255,255,255,.13);
  --fg:#EDEDEF; --fg2:#9B9BA3; --fg3:#57575F;
  --ok:#4CB782; --warn:#D9A050; --bad:#F87171; --info:#7AA2F7;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sans:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
::selection{background:rgba(76,183,130,.25)}
body{
  background:var(--bg);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse 60% 40% at 50% -10%,rgba(255,255,255,.045),transparent);
}
.wrap{max-width:880px;margin:0 auto;padding:0 28px 80px}

/* ── 顶栏 ── */
header{
  display:flex;align-items:center;gap:10px;
  padding:26px 0 0;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.2px}
.brand .mark{
  width:22px;height:22px;border-radius:6px;
  background:linear-gradient(135deg,#4CB782,#2E6B50);
  box-shadow:0 0 14px rgba(76,183,130,.35);
}
.brand span{font-size:15px}
.ver{font-family:var(--mono);font-size:11px;color:var(--fg3);margin-top:2px}
header .sp{flex:1}
.hdr-stat{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;color:var(--fg2)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px rgba(76,183,130,.6)}
.dot.off{background:var(--bad);box-shadow:0 0 8px rgba(248,113,113,.5);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

/* ── Hero：纯排印，无卡片 ── */
.hero{padding:72px 0 56px}
.hero h1{
  font-size:40px;font-weight:600;letter-spacing:-1.4px;line-height:1.12;
  font-variant-numeric:tabular-nums;
}
.hero h1 .n{color:var(--ok)}
.hero h1 .t{color:var(--fg3);font-weight:400}
.hero p{margin-top:14px;color:var(--fg2);font-size:14.5px;max-width:560px}
.hero p code{font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--card);border:1px solid var(--line);padding:2px 7px;border-radius:5px}
.hero p.note{margin-top:10px;font-size:12.5px;color:var(--fg3)}
.hero p.note b{color:var(--fg2);font-weight:500}

/* ── 指标行 ── */
.metrics{
  display:flex;gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-bottom:52px;
}
.metric{flex:1;padding:18px 4px 18px 0}
.metric+.metric{padding-left:26px;border-left:1px solid var(--line)}
.metric .k{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:4px}
.metric .v{font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.metric .v i{font-style:normal;color:var(--fg3);font-size:13px}

/* ── 区块标题 ── */
.sec{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:1.4px;margin:0 0 14px}

/* ── 模型列表 ── */
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.grp{
  display:flex;align-items:baseline;gap:8px;
  padding:13px 18px 11px;border-bottom:1px solid var(--line);
  background:rgba(255,255,255,.015);
}
.grp .g-name{font-weight:600;font-size:13px;letter-spacing:-.1px}
.grp .g-id{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.grp .g-n{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--fg3);font-variant-numeric:tabular-nums}
.row{
  display:grid;grid-template-columns:minmax(0,1fr) 64px 52px 96px 66px;
  gap:14px;align-items:center;
  padding:8px 18px;border-bottom:1px solid rgba(255,255,255,.04);
  font-family:var(--mono);font-size:12.5px;
  transition:background .15s ease;
}
.row:last-child{border-bottom:0}
.row:hover{background:var(--card-h)}
.row .id{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:9px}
.row .id .d{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.row .num{color:var(--fg2);text-align:right;font-variant-numeric:tabular-nums}
.row .st{font-size:11px;text-align:right;white-space:nowrap}
.st.ok{color:var(--ok)} .st.unknown{color:var(--fg3)} .st.limited{color:var(--warn)} .st.blocked{color:var(--bad)}
.row .auto{color:var(--fg3);font-size:10.5px;text-align:right}
.row .auto.on{color:var(--info)}
.d.ok{background:var(--ok)} .d.unknown{background:var(--fg3)} .d.limited{background:var(--warn)} .d.blocked{background:var(--bad)}

/* ── 接入 ── */
.conn{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
.crow{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid rgba(255,255,255,.04)}
.crow:last-child{border-bottom:0}
.crow .l{font-size:12px;color:var(--fg2);width:110px;flex-shrink:0}
.crow code{font-family:var(--mono);font-size:12.5px;color:var(--fg);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbtn{
  background:none;border:none;color:var(--fg3);cursor:pointer;
  padding:5px;border-radius:6px;display:grid;place-items:center;
  transition:color .15s ease,background .15s ease;
}
.cbtn:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.cbtn svg{width:14px;height:14px}

/* ── 按钮 ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 13px;border-radius:8px;
  background:transparent;border:1px solid var(--line-h);
  color:var(--fg);font-family:var(--sans);font-size:12.5px;font-weight:500;
  cursor:pointer;transition:all .16s ease;
}
.btn:hover{background:var(--card-h);border-color:rgba(255,255,255,.2)}
.btn:disabled{opacity:.4;cursor:default}
.btn svg{width:13px;height:13px}

footer{margin-top:64px;font-family:var(--mono);font-size:11px;color:var(--fg3);display:flex;gap:16px}
footer span+span::before{content:'·';margin-right:16px;color:var(--fg3)}

.toast{
  position:fixed;bottom:28px;left:50%;transform:translate(-50%,70px);
  background:#1A1A1E;border:1px solid var(--line-h);border-radius:10px;
  padding:9px 16px;font-size:12.5px;box-shadow:0 16px 40px rgba(0,0,0,.5);
  transition:transform .35s cubic-bezier(.32,1.3,.55,1);z-index:9;
}
.toast.show{transform:translate(-50%,0)}

.reveal{opacity:0;transform:translateY(10px);animation:up .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.a1{animation-delay:.04s}.a2{animation-delay:.1s}.a3{animation-delay:.16s}.a4{animation-delay:.22s}
@media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none}*{transition:none!important}}

@media (max-width:680px){
  .hero{padding:52px 0 40px}.hero h1{font-size:30px}
  .metrics{flex-wrap:wrap}.metric{flex:1 1 40%;padding:14px 0}
  .metric+.metric{padding-left:18px}
  .row{grid-template-columns:minmax(0,1fr) 52px 88px}
  .row .num.ctx,.row .auto{display:none}
  .wrap{padding:0 18px 60px}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand"><span class="mark"></span><span>keyless-llm</span></div>
    <span class="ver" id="hd-ver"></span>
    <span class="sp"></span>
    <span class="hdr-stat"><span class="dot" id="hd-dot"></span><span id="hd-live">连接中</span></span>
    <button class="btn" id="btn-probe" title="手动探测：每个待验证模型消耗 1 次请求额度，默认只探 8 个">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      探测
    </button>
  </header>

  <section class="hero reveal a1">
    <h1><span class="n" id="h-ok">–</span><span class="t"> / </span><span id="h-all">–</span><span class="t"> 个模型可用</span></h1>
    <p>免鉴权聚合网关。客户端把 base_url 指到 <code id="h-base">…</code>、模型填 <code>auto</code> 就行——限流、封禁、宕机都由网关自动换模型兜底。</p>
    <p class="note" id="h-note"></p>
  </section>

  <section class="metrics reveal a2" id="metrics"></section>

  <div class="sec reveal a3">模型 · 按来源</div>
  <div class="list reveal a3" id="models"></div>

  <div style="height:44px"></div>
  <div class="sec reveal a4">接入</div>
  <div class="conn reveal a4" id="conn"></div>

  <footer class="reveal a4">
    <span id="ft-up">–</span>
    <span id="ft-req">–</span>
    <span id="ft-tok">–</span>
    <span>10s 自动刷新</span>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s)=>document.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={healthy:['可用','ok'],unknown:['待验证','unknown'],limited:['限流','limited'],blocked:['封禁','blocked']};
const ORD={healthy:0,unknown:1,limited:2,blocked:3};
const fmtCtx=c=>!c?'–':c>=1e6?(c/1e6).toFixed(c%1e6?1:0)+'M':Math.round(c/1e3)+'K';
const fmtInt=n=>new Intl.NumberFormat('zh-CN').format(n||0);
function fmtUp(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}h ${m}m`:m?`${m}m`:`${Math.floor(s||0)}s`}
function fmtCd(ms){if(!ms)return'';const r=Math.max(0,Math.round((ms-Date.now())/1000));if(r<=0)return'';const m=Math.floor(r/60);return m?` ${m}m`:` ${r}s`}

async function refresh(){
  try{
    const st = await (await fetch('/v1/status')).json();
    $('#hd-live').textContent='运行中 · '+fmtUp(st.uptime);
    $('#hd-ver').textContent='v'+st.version;
    $('#hd-dot').className='dot';
    render(st);
  }catch{
    $('#hd-live').textContent='连接失败';
    $('#hd-dot').className='dot off';
  }
}

function render(st){
  const sum=st.summary;
  $('#h-ok').textContent=sum.healthy;
  $('#h-all').textContent=sum.total;
  $('#h-base').textContent=location.origin+'/v1';

  // 探测策略提示：默认被动学习，不主动烧额度
  const tested=st.models.filter(m=>m.state!=='unknown').length;
  const notes={
    passive:`已测 <b>${tested}/${st.total||st.models.length}</b> · 状态由真实请求被动学习（429 即标限流），默认不主动探测，省额度`,
    interval:`定时探测开启（每 ${Math.round(st.probeSeconds/60)} 分钟）· 已测 <b>${tested}/${st.models.length}</b>`,
    startup:`启动时探测过一轮 · 已测 <b>${tested}/${st.models.length}</b>`,
  };
  $('#h-note').innerHTML=notes[st.probeMode]||notes.passive;

  $('#metrics').innerHTML=[
    ['auto 池',st.models.filter(m=>m.auto).length,'≥256K · 工具调用'],
    ['限流中',sum.limited,sum.blocked?`另有封禁 ${sum.blocked}`:'含冷却倒计时'],
    ['来源',st.providers.filter(p=>p.enabled).length,`共 ${st.providers.length} 个`],
    ['累计请求',fmtInt(st.stats.requests),`转移 ${fmtInt(st.stats.failovers)} 次`],
  ].map(([k,v,s])=>`<div class="metric"><div class="k">${k}</div><div class="v">${esc(v)} <i>${esc(s)}</i></div></div>`).join('');

  const order={healthy:0,unknown:1,limited:2,blocked:3};
  $('#models').innerHTML=st.providers.filter(p=>p.enabled).map(p=>{
    const mine=st.models.filter(m=>m.provider===p.id)
      .sort((a,b)=>(ORD[a.state]??9)-(ORD[b.state]??9)||(b.tps||0)-(a.tps||0));
    if(!mine.length)return'';
    const h=mine.filter(m=>m.state==='healthy').length;
    return `<div class="grp"><span class="g-name">${esc(p.label)}</span><span class="g-id">${esc(p.id)}</span><span class="g-n">${h}/${mine.length}</span></div>`
      +mine.map(m=>{
        const[t,c]=ST[m.state]||ST.unknown;
        const cd=m.state==='limited'?fmtCd(m.cooldownUntil):'';
        const tps=m.tps?Math.round(m.tps)+'k t/s':'–';
        return `<div class="row">
          <span class="id" title="${esc(m.id)}"><span class="d ${c}"></span>${esc(m.id)}</span>
          <span class="num ctx">${fmtCtx(m.ctx)}</span>
          <span class="auto ${m.auto?'on':''}">${m.auto?'auto':''}</span>
          <span class="st ${c}">${t}${cd}</span>
          <span class="num">${tps}</span>
        </div>`;
      }).join('');
  }).join('');

  const b=location.origin;
  $('#conn').innerHTML=[
    ['OpenAI 兼容',b+'/v1','auto 或 <来源>/<模型>'],
    ['Anthropic 兼容',b,'model 填 auto'],
  ].map((c,i)=>`<div class="crow"><span class="l">${c[0]}</span><code id="cv${i}">${esc(c[1])}</code>
    <button class="cbtn" data-v="${esc(c[1])}" title="复制">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button></div>`).join('');

  $('#ft-up').textContent='运行 '+fmtUp(st.uptime);
  $('#ft-req').textContent='请求 '+fmtInt(st.stats.requests);
  $('#ft-tok').textContent='token '+fmtInt(st.stats.tokensIn)+'/'+fmtInt(st.stats.tokensOut);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('.cbtn');if(!b)return;
  navigator.clipboard.writeText(b.dataset.v).then(()=>toast('已复制'));
});
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600)}

$('#btn-probe').addEventListener('click',async e=>{
  const b=e.currentTarget;b.disabled=true;
  try{
    // limit=8：一轮最多探 8 个，避免一次烧掉几十分钟配额
    await fetch('/v1/probe?force=1&limit=8',{method:'POST'});
    toast('探测 8 个模型 · 消耗 8 次请求额度');
    setTimeout(refresh,14000);
  }catch{toast('探测失败')}
  setTimeout(()=>b.disabled=false,15000);
});

setInterval(()=>{if(!document.hidden)refresh()},10000);
refresh();
</script>
</body>
</html>
